function cuts(q,m,axis){
  const points=[0,N];
  if(axis==="x")for(let i=1;i<q.d;i++)points.push(i*N/q.d);
  const cut=m.cuts[axis];
  if(cut){
    const width=axis==="x"&&cut.scope==="source"?q.n*N/q.d:N;
    for(let i=1;i<cut.count;i++)points.push(i*width/cut.count);
  }
  return [...new Set(points)].sort((a,b)=>a-b);
}
function cells(q,m){
  const x=cuts(q,m,"x"),y=cuts(q,m,"y"), list=[];
  for(let r=0;r<y.length-1;r++)for(let c=0;c<x.length-1;c++)list.push([x[c],y[r],x[c+1],y[r+1]]);
  return list;
}
function contains(a,b){return a[0]<=b[0]&&a[1]<=b[1]&&a[2]>=b[2]&&a[3]>=b[3];}
function isTaken(m,c){return m.selected.some(part=>contains(part,c));}
function area(c){return (c[2]-c[0])*(c[3]-c[1]);}
function modelHtml(q,m,live=false,counts=false){
  const list=cells(q,m), source=q.n*N/q.d;
  const grid=list.map((c,i)=>{
    const original=c[2]<=source, chosen=isTaken(m,c);
    const name=original?"原有部分":"原有部分以外";
    const pos="left:"+(100*c[0]/N)+"%;top:"+(100*c[1]/N)+"%;width:"+(100*(c[2]-c[0])/N)+"%;height:"+(100*(c[3]-c[1])/N)+"%";
    const klass="cell"+(original?" original":"")+(chosen?" taken":"")+(live?" live":"");
    return live?'<button type="button" data-act="cell" data-value="'+i+'" class="'+klass+'" style="'+pos+'" aria-pressed="'+chosen+'" aria-label="第 '+(i+1)+' 格，'+name+'"></button>':'<span class="'+klass+'" style="'+pos+'" aria-hidden="true"></span>';
  }).join("");
  const selected=list.filter(c=>isTaken(m,c));
  let note="";
  if(counts){
    const num=selected.reduce((sum,c)=>sum+area(c),0);
    const same=list.every(c=>area(c)===area(list[0]));
    const [n,d]=rational(num,N*N);
    note='<p class="evidence">'+(same?"全圖 "+list.length+" 等格，選了 "+selected.length+" 格。":"目前格子有不同面積。所選部分佔整體 "+frac(n,d)+"。")+
      (selected.some(c=>c[2]>source)?" 有選取超出原有部分的範圍。":"")+'</p>';
  }
  return '<div class="model-label"><span>原來 1 個蛋糕</span><span>原有 '+frac(q.n,q.d)+'</span></div><div class="cake-grid" '+(live?'aria-label="可選取的蛋糕模型"':'role="img" aria-label="蛋糕面積模型"')+'>'+grid+'</div><div class="legend"><span><i class="key base"></i>原有部分</span><span><i class="key cut"></i>取用部分</span><span><i class="key"></i>已沒有的部分</span></div>'+note;
}

function keepAnswerDraft(){

}
function redrawModel(draft){
 render();

 if(f&&draft)for(const [key,value] of Object.entries(draft))if(f.elements.namedItem(key))f.elements.namedItem(key).value=value;
}
function adjust(change){

function workId(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);}
function pickMember(){return '<div class="toolbar turn"><span class="small">作答者</span>'+[1,2].map(n=>button("組員 "+n,"member",n,n===member?"active":"","aria-pressed="+(n===member))).join("")+'</div>';}
function fInputs(n="num",d="den",required=false){

function predRecords(pred){const rows=Object.entries(pred);return rows.length?rows.map(([i,r])=>'<div class="record">組員 '+i+' · '+choices[r.choice]+(r.f?' · '+frac(...r.f):"")+'</div>').join(""):'<p class="small">這組還未保留預測。</p>';}
function allWorks(){

function workbench(){

 let side="", model="";

   model=modelHtml(q,blank());

   side='<h2>用模型表示訂單</h2><p>選擇要等分的範圍及份數，再點選要買走的部分。完成後保留一幅能說明你想法的圖。</p><h3>原始預測</h3>'+predRecords(c.pred)+'<p class="small">已保留 '+c.works.length+' 幅作品。</p>';
 }else{

   if(c.rev[member])side+='<div class="record">組員 '+member+' · '+(c.rev[member].choice==="keep"?"保留":"修正")+(c.rev[member].f?" · "+frac(...c.rev[member].f):"")+'</div>';

   if(works.length)side+='<p class="small">教師可在作品簿挑選兩幅圖比較。</p>';
 }
 return pButtons+'<div class="workspace"><section class="panel">'+model+'</section><section class="panel">'+side+'</section></div>'+
 (role==="host"&&phase!=="P"?'<div class="toolbar">'+button(showGrid?"隱藏格數":"顯示格數","grid")+ (phase==="E"?button(reveal?"收起參考解答":"揭示參考解答","reveal","","primary"):"")+'</div>':"")+
 (reveal&&role==="host"&&phase==="E"?'<section class="panel"><h2>教師參考模型</h2>'+proof(q)+'</section>':"");

document.addEventListener("click",e=>{
 const b=e.target.closest("button[data-act]");if(!b)return;
 const a=b.dataset.act,v=b.dataset.value;
 if(a==="home"){role="home";render();window.scrollTo(0,0);return;}
 if(a==="start"){begin("host",v);return;}
 if(a==="setup"){role="setup";render();return;}
 if(a==="page"){navigate(v);return;}
 if(a==="phase"){setPhase(v);return;}
 if(a==="member"){
   if(document.querySelector("#prediction input:checked")||document.querySelector("#answer input")?.value) {
     if(!confirm("切換組員前，請確認已保留目前作答。繼續切換？"))return;
   }
   if((page==="transfer"||page==="exit")&&member!==+v){
     const c=current();c.memberModels??={};c.memberModels[member]=copy(c.model);
     c.model=copy(c.memberModels[+v]??blank());c.activeMember=+v;undo=[];persist();
   }
   member=+v;render();return;
 }
 if(a==="reveal"&&role==="host"){reveal=!reveal;render();return;}
 if(a==="grid"&&role==="host"){const draft=keepAnswerDraft();showGrid=!showGrid;redrawModel(draft);return;}
 if(a==="clock"){begun=begun?0:Date.now();render();return;}
 if(a==="books"&&role==="host"){showBooks=!showBooks;render();return;}
 if(a==="compare"&&role==="host"){compare=compare.includes(v)?compare.filter(k=>k!==v):[...compare.slice(-1),v];render();return;}
 if(a==="export"&&role==="student"){download();return;}
 if(a==="pick"){const c=current();const picks=c.cakes??[];c.cakes=picks.includes(+v)?picks.filter(i=>i!==+v):[...picks,+v];persist();render();return;}
 if(a==="cell"){
   const q=problems[page];const c=cells(q,current().model)[Number(v)];
   if(c){adjust(m=>{m.selected=isTaken(m,c)?m.selected.filter(p=>!contains(p,c)):[...m.selected,c];});root.querySelector('[data-act="cell"][data-value="'+v+'"]')?.focus();}
   return;
 }
 if(a==="undo"&&undo.length){const draft=keepAnswerDraft();current().model=undo.pop();persist();redrawModel(draft);return;}
 if(a==="reset"){adjust(m=>Object.assign(m,blank()));return;}
 if(a==="save-work"&&phase==="O"){
   const c=current();if(c.works.length>=20){toast("這組已保存 20 幅作品。");return;}
   const id=workId();c.works.push({id,model:copy(c.model)});c.picked=id;persist();render();toast(saved?"已保留作品":"目前瀏覽器未能保存。請在離開前匯出。");
 }
});
root.addEventListener("submit",e=>{
 e.preventDefault();
 const form=new FormData(e.target);
 try{
   if(e.target.id==="join"){begin("student",form.get("mode"),Number(form.get("group")));return;}
   const c=current();
   if(e.target.id==="split"){
     const q=problems[page],axis=form.get("axis");
     adjust(m=>{
       const old=copy(m);m.cuts[axis]={count:Number(form.get("count")),scope:form.get("scope")};
       m.selected=cells(q,m).filter(cell=>isTaken(old,cell));
     });
     return;
   }
   if(e.target.id==="prediction"&&!c.pred[member])c.pred[member]={choice:form.get("choice"),f:submitFraction(form)};
   if(e.target.id==="revision"&&!c.rev[member])c.rev[member]={choice:form.get("choice"),f:submitFraction(form)};
   if(e.target.id==="answer"){
     const values=[submitFraction(form,"n1","d1")];
     if(page==="exit")values.push(submitFraction(form,"n2","d2"),form.get("size"));
     const rs=c.answers[member]??[];
     if(rs.length<2)c.answers[member]=[...rs,{values,model:copy(c.model)}];
   }
   persist();render();toast(saved?"已保留紀錄":"目前瀏覽器未能保存。請在離開前匯出。");
 }catch(error){toast(error.message);}
});
const validRect=c=>Array.isArray(c)&&c.length===4&&c.every(n=>Number.isInteger(n)&&n>=0&&n<=N)&&c[0]<c[2]&&c[1]<c[3];
const validFrac=f=>Array.isArray(f)&&f.length===2&&f.every(Number.isInteger)&&f[0]>=0&&f[0]<=999&&f[1]>=1&&f[1]<=999;
function cleanModel(m){
 if(!m||!m.cuts||!Array.isArray(m.selected))return blank();
 const cuts={x:null,y:null};
 for(const k of ["x","y"]){const c=m.cuts[k];if(c&&[2,3,4,5,6].includes(c.count)&&["all","source"].includes(c.scope))cuts[k]={count:c.count,scope:c.scope};}
 return {cuts,selected:m.selected.filter(validRect).slice(0,120)};
}
function safePack(pack){
 if(pack?.type!=="cake-poe-15"||!Number.isInteger(pack.group)||pack.group<1||pack.group>20||!pack.data)throw Error("無法讀取這份作品。");
 const data={};
 for(const k of ["a","b","transfer","exit"]){
   const r=pack.data[k];if(!r)continue;
   const w=Array.isArray(r.works)?r.works.slice(0,20):[];
   const clean={works:w.map((v,i)=>({id:String(i),model:cleanModel(v?.model)})),pred:{},rev:{},answers:{}};
   for(const member of [1,2]){
     for(const type of ["pred","rev"]){
       const a=r[type]?.[member],keys=type==="pred"?Object.keys(choices):["keep","change"];
       if(a&&keys.includes(a.choice))clean[type][member]={choice:a.choice,f:validFrac(a.f)?a.f:null};
     }
     const rs=r.answers?.[member];
     if(Array.isArray(rs))clean.answers[member]=rs.slice(0,2).map(a=>({values:(Array.isArray(a?.values)?a.values:[]).slice(0,3).filter(x=>validFrac(x)||Object.keys(choices).includes(x)),model:cleanModel(a?.model)}));
   }
   data[k]=clean;
 }
 return {id:workId(),group:pack.group,data};
}
root.addEventListener("change",async e=>{
 if(e.target.id==="import"&&role==="host"){
   let added=0;
   for(const file of [...e.target.files].slice(0,20)){
     try{if(file.size>600000)throw Error();const pack=safePack(JSON.parse(await file.text()));bookPacks=bookPacks.filter(p=>p.group!==pack.group).concat(pack);added++;}
     catch{toast("有檔案無法讀取，請選擇網站匯出的紀錄。");}
   }
   if(added){write("cake-poe-books",bookPacks);render();toast("已匯入 "+added+" 份紀錄");}
 }
 if(e.target.dataset.observe&&role==="host"){
   const records=read("cake-poe-observations",{});records[e.target.dataset.observe+"-"+e.target.dataset.member]=e.target.value;write("cake-poe-observations",records);toast("已保留觀察標記");
 }
});
render();
</script>
</body>
</html>
